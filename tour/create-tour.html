<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm mới tour du lịch</title>

    <link rel="stylesheet" href="./style-tour.css">
</head>

<body>

    <div class="create-tour">

        <div class="container">

            <h1 class="page-title">
                Thêm mới tour du lịch
            </h1>

            <form class="tour-form">

                <!-- Tên tour -->
                <div class="form-group">
                    <label>Tên tour</label>

                    <input type="text" placeholder="Nhập tên tour">
                </div>

                <!-- Địa điểm -->
                <div class="form-group">
                    <label>Địa điểm</label>

                    <input type="text" placeholder="Ví dụ: Đà Lạt">
                </div>

                <!-- Giá -->
                <div class="form-group">
                    <label>Giá tour</label>

                    <input type="number" placeholder="Nhập giá tour">
                </div>

                <!-- Số ngày -->
                <div class="form-group">
                    <label>Số ngày</label>

                    <input type="number" placeholder="Ví dụ: 3">
                </div>

                <!-- Mô tả -->
                <div class="form-group">
                    <label>Mô tả</label>

                    <textarea rows="5" placeholder="Nhập mô tả tour du lịch"></textarea>
                </div>

                <!-- Upload ảnh -->
                <div class="form-group">

                    <label>Ảnh tour</label>

                    <input type="file" id="tour-image" accept="image/*">

                </div>

                <!-- Preview -->
                <div class="preview-image">

                    <img id="preview" src="https://placehold.co/600x400?text=Preview+Image" alt="preview">

                </div>

                <!-- Submit -->
                <button type="submit" class="btn-submit">
                    Thêm tour
                </button>

            </form>

        </div>

    </div>

    <script src="./script-tour.js"></script>

</body>

</html>
